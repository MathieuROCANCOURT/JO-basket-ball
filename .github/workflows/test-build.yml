name: Build & Test Site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify Output
        run: |
          echo "=== Checking dist folder ==="
          ls -la dist/
          
          echo "=== Checking translations ==="
          ls -la dist/translations/
          
          # Fail if files are missing
          test -f dist/translations/fr.json
          test -f dist/translations/en.json
          test -f dist/medals.js
          test -f dist/calculator.js
          test -f dist/parser.js
          test -f dist/renderer.js
          test -f dist/translations-loader.js
          test -f dist/translations.js
          test -f dist/types.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist