<!DOCTYPE html>
<html lang="fr-FR">

<head>
	<link rel="stylesheet" type="text/css" href="../base.css">
	<link rel="stylesheet" type="text/css" href="index.css">
	<meta charset="UTF-8">
	<meta name="author" content="Mathieu Rocancourt">
	<title>Les médailles au Jeux Olympique</title>
</head>

<body>
	<header>
		<!--lien vers la page d'accueil-->
		<a href="../../index.html"> Retour au menu</a>
		<!--titre de l'article-->
		<h1> Les médailles </h1>
	</header>
	<main>
		<div id="tableContainer">
			<fieldset class="masculin">
				<legend> Masculin </legend>
			</fieldset>
			<fieldset class="feminin">
				<legend> Féminin </legend>
			</fieldset>
		</div>
		<div id="totalMedalsContainer">
			<fieldset>
				<legend> Nombre de médailles au total </legend>
			</fieldset>
		</div>

		<script>
			/* Historic → modern country map */
			const COUNTRY_ALIAS = {
				"Soviet Union": "Russia",
				"Unified": "Russia",
				"USSR": "Russia",
				"Yugoslavia": "Serbia",
				"Serbia and Montenegro": "Serbia"
			};

			function normaliseCountry(name) {
				const t = name.trim();
				return COUNTRY_ALIAS[t] || t;
			}

			/* CSV → array of rows (trimmed cells) */
			function parseCsv(csv) {
				return csv.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(',').map(c => c.trim()));
			}

			/* Build a dictionary {Country → {Gold,Silver,Bronze,Total}} */
			function buildMedalDict(rows) {
				const dict = {};

				for (const row of rows) {
					const gold = row[3];
					const silver = row[4];
					const bronze = row[5];

					const add = (rawCountry, type) => {
						const country = normaliseCountry(rawCountry);
						if (!dict[country]) {
							dict[country] = { Country: country, Gold: 0, Silver: 0, Bronze: 0, Total: 0 };
						}
						dict[country][type]++;
						dict[country].Total++;
					};

					add(gold, "Gold");
					add(silver, "Silver");
					add(bronze, "Bronze");
				}
				return dict;
			}

			/* Merge two dictionaries (men + women) */
			function mergeDicts(a, b) {
				const result = { ...a };
				for (const [c, cnt] of Object.entries(b)) {
					if (!result[c]) {
						result[c] = { ...cnt };
					} else {
						result[c].Gold += cnt.Gold;
						result[c].Silver += cnt.Silver;
						result[c].Bronze += cnt.Bronze;
						result[c].Total += cnt.Total;
					}
				}
				return result;
			}

			/* Comparator used for every table (descending order) */
			function medalComparator(a, b) {
				// Gold, then Silver, then Bronze, then Total
				// If everything is equal we sort alphabetically to keep the order deterministic
				return b.Gold - a.Gold ||
					b.Silver - a.Silver ||
					b.Bronze - a.Bronze ||
					b.Total - a.Total ||
					a.Country.localeCompare(b.Country);
			}

			/* Equality test – used for tie detection */
			function equal(a, b) {
				return a.Gold === b.Gold && a.Silver === b.Silver && a.Bronze === b.Bronze;
			}

			/* Render a ranking table (Pos., Pays, Or, Argent, Bronze, Total)*/
			function renderRankingTable(countries, container, genderLabel) {
				// Compute column maxima for bold‑only‑max
				const maxGold = Math.max(...countries.map(c => c.Gold));
				const maxSilver = Math.max(...countries.map(c => c.Silver));
				const maxBronze = Math.max(...countries.map(c => c.Bronze));
				const maxTotal = Math.max(...countries.map(c => c.Total));

				const maybeBold = (val, max) => (val === max ? `<b>${val}</b>` : `${val}`);

				const table = document.createElement('table');
				table.innerHTML = `
                    <caption>Palmarès</caption>
                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Pays</th>
                            <th>Or</th>
                            <th>Argent</th>
                            <th>Bronze</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                `;
				const tbody = document.createElement("tbody");
				table.appendChild(tbody);

				let rank = 1;
				for (let i = 0; i < countries.length; i++) {
					const cur = countries[i];

					// ---- count ties -------------------------------------------------
					let tieCount = 1;
					while (i + tieCount < countries.length && equal(cur, countries[i + tieCount])) {
						tieCount++;
					}

					// ---- first row of the tie group (shows the rank) ---------------
					const first = document.createElement("tr");
					first.innerHTML = `
                        <td rowspan="${tieCount}">${rank}</td>
                        <td>${cur.Country}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Gold, maxGold)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Silver, maxSilver)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Bronze, maxBronze)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Total, maxTotal)}</td>
                    `;
					tbody.appendChild(first);

					// ---- any additional tied rows (only country name) -------------
					for (let j = 1; j < tieCount; j++) {
						const tied = countries[i + j];
						const tieRow = document.createElement("tr");
						tieRow.innerHTML = `<td>${tied.Country}</td>`;
						tbody.appendChild(tieRow);
					}

					i += tieCount - 1;   // skip the whole tie block
					rank += tieCount;    // next rank after the tie group
				}

				container.appendChild(table);
			}

			/* Render the edition table (Year / City / Gold / Silver / Bronze) */
			function renderEditionTable(rows, container, genderLabel) {
				const table = document.createElement("table");
				table.innerHTML = `
                    <caption>Tableau des médailles</caption>
                    <thead>
                        <tr>
                            <th>Année</th>
                            <th>Ville</th>
                            <th>Médaille d'or</th>
                            <th>Médaille d'argent</th>
                            <th>Médaille de bronze</th>
                        </tr>
                    </thead>
                `;
				const tbody = document.createElement("tbody");
				table.appendChild(tbody);

				for (const r of rows) {
					const [year, city, , gold, silver, bronze] = r;
					const tr = document.createElement("tr");
					tr.innerHTML = `
                        <td>${year}</td>
                        <td>${city}</td>
                        <td>${gold}</td>
                        <td>${silver}</td>
                        <td>${bronze}</td>
                    `;
					tbody.appendChild(tr);
				}

				container.appendChild(table);
			}

			/* Render the total‑medals table (combined men + women) */
			function renderTotalTable(sortedCountries, container) {
				// Compute column maxima for the total table as well
				const maxGold = Math.max(...sortedCountries.map(c => c.Gold));
				const maxSilver = Math.max(...sortedCountries.map(c => c.Silver));
				const maxBronze = Math.max(...sortedCountries.map(c => c.Bronze));
				const maxTotal = Math.max(...sortedCountries.map(c => c.Total));
				const maybeBold = (val, max) => (val === max ? `<b>${val}</b>` : `${val}`);

				const table = document.createElement("table");
				table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>Nation</th>
                            <th>Or</th>
                            <th>Argent</th>
                            <th>Bronze</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                `;
				const tbody = document.createElement("tbody");
				table.appendChild(tbody);

				let rank = 1;
				for (let i = 0; i < sortedCountries.length; i++) {
					const cur = sortedCountries[i];
					// ---- tie detection (same as before) -------------------------
					let tieCount = 1;
					while (i + tieCount < sortedCountries.length &&
						equal(cur, sortedCountries[i + tieCount])) {
						tieCount++;
					}

					// ---- first row of the tie group -----------------------------
					const first = document.createElement("tr");
					first.innerHTML = `
                        <td rowspan="${tieCount}">${rank}</td>
                        <td>${cur.Country}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Gold, maxGold)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Silver, maxSilver)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Bronze, maxBronze)}</td>
                        <td rowspan="${tieCount}">${maybeBold(cur.Total, maxTotal)}</td>
                    `;
					tbody.appendChild(first);

					// ---- any additional tied rows (only country name) ----------
					for (let j = 1; j < tieCount; j++) {
						const tied = sortedCountries[i + j];
						const tieRow = document.createElement('tr');
						tieRow.innerHTML = `<td>${tied.Country}</td>`;
						tbody.appendChild(tieRow);
					}

					i += tieCount - 1;
					rank += tieCount;
				}

				// The container we received is the <fieldset>, not the wrapper div
				container.appendChild(table);
			}

			/* Main driver – load CSVs, build dictionaries, render tables */
			async function init() {
				// Load both CSV files in parallel
				const [menCsv, womenCsv] = await Promise.all([
					fetch('../../data/men_medals.csv').then(r => r.text()),
					fetch('../../data/woman_medals.csv').then(r => r.text())
				]);

				// ---------- Parse & build per‑gender dictionaries ----------
				const menRows = parseCsv(menCsv);
				const womenRows = parseCsv(womenCsv);
				menRows.shift();   // drop header
				womenRows.shift(); // drop header

				const menDict = buildMedalDict(menRows);
				const womenDict = buildMedalDict(womenRows);

				// ---------- Render MEN tables ----------
				const menArray = Object.values(menDict).sort(medalComparator);
				const menFieldset = document.querySelector('.masculin');
				renderEditionTable(menRows, menFieldset, 'Hommes');
				menFieldset.appendChild(document.createElement("p"));
				renderRankingTable(menArray, menFieldset, 'Hommes');

				// ---------- Render WOMEN tables ----------
				const womenArray = Object.values(womenDict).sort(medalComparator);
				const womenFieldset = document.querySelector('.feminin');
				renderEditionTable(womenRows, womenFieldset, 'Femmes');
				womenFieldset.appendChild(document.createElement("p"));
				renderRankingTable(womenArray, womenFieldset, 'Femmes');

				// ---------- Build TOTAL‑MEDALS table ----------
				const totalDict = mergeDicts(menDict, womenDict);
				const totalArray = Object.values(totalDict).sort(medalComparator);

				// The container we want is the <fieldset> inside #totalMedalsContainer
				const totalFieldset = document.querySelector('#totalMedalsContainer fieldset');
				renderTotalTable(totalArray, totalFieldset);
			}

			// Kick‑off when the DOM is ready
			document.addEventListener('DOMContentLoaded', init);
		</script>
		</div>

	</main>
